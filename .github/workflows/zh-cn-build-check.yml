name: Simplified Chinese build check
on:
  push:
    branches:
      - build/zh-cn-check-6812bee-20261028

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Select .NET 8 SDK for this runner
        shell: pwsh
        run: |
          '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}' | Set-Content -Path global.json -Encoding utf8
          dotnet --version
      - name: Locate Visual Studio 2022 MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64
      - name: Build Release x64
        shell: pwsh
        run: msbuild S-Launcher.sln /restore /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
      - name: Verify application and Chinese resources
        id: build-output
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path SLauncher/bin -Filter SLauncher.exe -Recurse -File | Select-Object -First 1
          if ($null -eq $exe) { throw 'Build completed without SLauncher.exe in the output directory.' }
          $zhResource = Join-Path $exe.Directory.FullName 'Strings/zh-CN/Resources.resw'
          if (-not (Test-Path -LiteralPath $zhResource)) { throw "Chinese resource missing: $zhResource" }
          "directory=$($exe.Directory.FullName)" >> $env:GITHUB_OUTPUT
      - name: Save build output
        uses: actions/upload-artifact@v4
        with:
          name: SLauncher-zh-CN-win-x64
          path: ${{ steps.build-output.outputs.directory }}
          if-no-files-found: error
          retention-days: 3

      - name: Inspect windows
        continue-on-error: true
        shell: powershell
        run: .github/scripts/capture-ui.ps1 -ExeDirectory "${{ steps.build-output.outputs.directory }}"
      - name: Save UI captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SLauncher-ui-evidence
          path: ui-evidence/
          if-no-files-found: ignore
          retention-days: 3
